id: wenxin-to-identity
source:
  object_type: identity.wenxin
  path: identity/wenxin/WENXIN_REPORT.md

target:
  openclaw:
    path: IDENTITY.md
  hermes:
    path: PROFILE.md

transform:
  mode: semantic_reduction
  include:
    - summary
    - core_findings
    - next_evidence_needed
  exclude:
    - private_raw_material
    - unsupported_personality_claims

guards:
  require_provenance: true
  forbid_secrets: true
  forbid_raw_private_body: true

coverage:
  expected_status: supported
