id: runtime-skill-to-runtime-skill
source:
  object_type: runtime_skill
  path: skills/runtime/

target:
  openclaw:
    path: skills/
  hermes:
    path: skills/

transform:
  mode: skill_package_projection
  include:
    - skill_readme
    - skill_md
    - validation_notes
  exclude:
    - run_logs
    - private_evidence_bodies

guards:
  forbid_secrets: true
  forbid_raw_private_body: true

coverage:
  expected_status: supported
