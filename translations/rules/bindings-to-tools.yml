id: bindings-to-tools
source:
  object_type: skill_binding
  path: skills/bindings/data-sources.yml

target:
  openclaw:
    path: TOOLS.md
  hermes:
    path: config.yaml

transform:
  mode: binding_summary
  include:
    - connector_dependencies
    - fact_dependencies
    - visibility_constraints
  exclude:
    - embedded_user_facts
    - secrets

guards:
  forbid_secrets: true

coverage:
  expected_status: partial
