<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">openLifeOS cognition object map</title>
  <desc id="desc">A visual map separating ephemeral memory, working lessons, long-term memory, runtime skills, runtime skills, meta skills, identity, policy, data sources, and skill capability memory.</desc>
  <defs>
    <style>
      .bg { fill: #f5f5f7; }
      .ink { fill: #1d1d1f; }
      .muted { fill: #6e6e73; }
      .panel { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1; }
      .dark { fill: #242426; }
      .blue { fill: #0066cc; }
      .blue-stroke { stroke: #0066cc; stroke-width: 2; fill: none; }
      .hair { stroke: #d9d9df; stroke-width: 1.2; fill: none; }
      .label { font: 600 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .body { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .small { font: 500 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0066cc"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="620"/>

  <text x="72" y="78" class="label ink" font-size="34">Typed cognition objects</text>
  <text x="72" y="112" class="body muted">Memory stores what is true. Skill stores how to do it. Mixed input is split before durable write.</text>

  <rect x="72" y="156" width="308" height="128" rx="18" class="panel"/>
  <text x="96" y="194" class="label ink">Ephemeral memory</text>
  <text x="96" y="224" class="body muted">Current run state, temporary</text>
  <text x="96" y="247" class="body muted">observations, active plan.</text>
  <rect x="96" y="258" width="116" height="24" rx="12" fill="#edf5ff"/>
  <text x="110" y="275" class="mono blue">not durable</text>

  <rect x="446" y="156" width="308" height="128" rx="18" class="panel"/>
  <text x="470" y="194" class="label ink">Working lesson</text>
  <text x="470" y="224" class="body muted">Candidate evidence that still</text>
  <text x="470" y="247" class="body muted">needs review and promotion.</text>
  <rect x="470" y="258" width="148" height="24" rx="12" fill="#edf5ff"/>
  <text x="484" y="275" class="mono blue">promotion gate</text>

  <rect x="820" y="156" width="308" height="128" rx="18" class="panel"/>
  <text x="844" y="194" class="label ink">Long-term memory</text>
  <text x="844" y="224" class="body muted">Stable facts, preferences,</text>
  <text x="844" y="247" class="body muted">decisions, constraints.</text>
  <rect x="844" y="258" width="134" height="24" rx="12" fill="#edf5ff"/>
  <text x="858" y="275" class="mono blue">declarative</text>

  <path d="M 380 220 C 408 220 418 220 446 220" class="blue-stroke" marker-end="url(#arrow)"/>
  <path d="M 754 220 C 782 220 792 220 820 220" class="blue-stroke" marker-end="url(#arrow)"/>

  <rect x="72" y="346" width="250" height="132" rx="18" class="dark"/>
  <text x="96" y="384" class="label" fill="#ffffff">Runtime skill</text>
  <text x="96" y="414" class="body" fill="#cccccc">Procedure, tools, scripts,</text>
  <text x="96" y="437" class="body" fill="#cccccc">validation, recovery.</text>
  <text x="96" y="464" class="mono" fill="#8ec5ff">runtime/runtime-skills/</text>

  <rect x="356" y="346" width="250" height="132" rx="18" class="dark"/>
  <text x="380" y="384" class="label" fill="#ffffff">Meta skill</text>
  <text x="380" y="414" class="body" fill="#cccccc">Reusable judgment, routing,</text>
  <text x="380" y="437" class="body" fill="#cccccc">methodology, review gates.</text>
  <text x="380" y="464" class="mono" fill="#8ec5ff">capabilities/</text>

  <rect x="640" y="346" width="250" height="132" rx="18" class="panel"/>
  <text x="664" y="384" class="label ink">Distilled knowledge</text>
  <text x="664" y="414" class="body muted">Claims, evidence, freshness,</text>
  <text x="664" y="437" class="body muted">contradiction status.</text>
  <text x="664" y="464" class="mono blue">capabilities/*/memory/</text>

  <rect x="924" y="346" width="204" height="132" rx="18" class="panel"/>
  <text x="948" y="384" class="label ink">Bindings</text>
  <text x="948" y="414" class="body muted">Connect skills to</text>
  <text x="948" y="437" class="body muted">current truth sources.</text>
  <text x="948" y="464" class="mono blue">identity/cognition/skill-bindings/</text>

  <path d="M 560 284 C 542 314 514 328 482 346" class="hair"/>
  <path d="M 600 284 C 646 316 706 324 744 346" class="hair"/>
  <path d="M 1000 346 C 982 316 930 300 890 284" class="hair"/>

  <rect x="72" y="526" width="1056" height="54" rx="27" fill="#ffffff" stroke="#e0e0e0"/>
  <circle cx="102" cy="553" r="8" class="blue"/>
  <text x="124" y="559" class="small ink">Identity and policy stay separate from memory; data sources declare authority before evidence can move.</text>
</svg>
