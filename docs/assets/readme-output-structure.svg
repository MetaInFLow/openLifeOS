<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">openLifeOS generated output structure</title>
  <desc id="desc">A visual structure of the generated LifeOS repo showing identity, metabolism, runtime, evolution, capabilities, identities, integrations, security, docs, and legacy layers.</desc>
  <defs>
    <style>
      .bg { fill: #f5f5f7; }
      .ink { fill: #1d1d1f; }
      .muted { fill: #6e6e73; }
      .panel { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1; }
      .dark { fill: #242426; }
      .blue { fill: #0066cc; }
      .label { font: 600 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .body { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .small { font: 500 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .mono { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="620"/>

  <text x="72" y="74" class="label ink" font-size="34">Generated LifeOS repo</text>
  <text x="72" y="108" class="body muted">The factory output is not a single prompt. It is a typed filesystem for identity, metabolism, runtime evidence, capabilities, identity projections, and permissions.</text>

  <rect x="72" y="150" width="1056" height="384" rx="24" class="panel"/>
  <rect x="72" y="150" width="1056" height="62" rx="24" class="dark"/>
  <text x="104" y="189" class="label" fill="#ffffff">Target.LifeOS/</text>
  <text x="938" y="188" class="mono" fill="#8ec5ff">output/meta/</text>

  <g transform="translate(104 250)">
    <rect width="214" height="94" rx="18" fill="#f5f5f7"/>
    <text x="20" y="34" class="label ink">identity</text>
    <text x="20" y="62" class="body muted">PSP / Wenxin</text>
    <text x="20" y="82" class="mono blue">cognition + memories</text>
  </g>

  <g transform="translate(350 250)">
    <rect width="214" height="94" rx="18" fill="#f5f5f7"/>
    <text x="20" y="34" class="label ink">identity</text>
    <text x="20" y="62" class="body muted">Public profile</text>
    <text x="20" y="82" class="mono blue">Wenxin + PSP</text>
  </g>

  <g transform="translate(596 250)">
    <rect width="214" height="94" rx="18" fill="#f5f5f7"/>
    <text x="20" y="34" class="label ink">runtime</text>
    <text x="20" y="62" class="body muted">sessions + lessons,</text>
    <text x="20" y="82" class="mono blue">runtime skills</text>
  </g>

  <g transform="translate(842 250)">
    <rect width="214" height="94" rx="18" fill="#f5f5f7"/>
    <text x="20" y="34" class="label ink">capabilities</text>
    <text x="20" y="62" class="body muted">durable abilities</text>
    <text x="20" y="82" class="mono blue">capability memory</text>
  </g>

  <g transform="translate(104 380)">
    <rect width="214" height="94" rx="18" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="20" y="34" class="label ink">integrations</text>
    <text x="20" y="62" class="body muted">Data sources</text>
    <text x="20" y="82" class="mono blue">authority policy</text>
  </g>

  <g transform="translate(350 380)">
    <rect width="214" height="94" rx="18" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="20" y="34" class="label ink">security</text>
    <text x="20" y="62" class="body muted">Secrets, privacy,</text>
    <text x="20" y="82" class="mono blue">publication gate</text>
  </g>

  <g transform="translate(596 380)">
    <rect width="214" height="94" rx="18" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="20" y="34" class="label ink">docs</text>
    <text x="20" y="62" class="body muted">Human-facing</text>
    <text x="20" y="82" class="mono blue">explanations</text>
  </g>

  <g transform="translate(842 380)">
    <rect width="214" height="94" rx="18" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="20" y="34" class="label ink">identities</text>
    <text x="20" y="62" class="body muted">Founder / teacher</text>
    <text x="20" y="82" class="mono blue">author / speaker</text>
  </g>

  <rect x="72" y="562" width="1056" height="32" rx="16" fill="#ffffff" stroke="#e0e0e0"/>
  <circle cx="102" cy="578" r="7" class="blue"/>
  <text x="124" y="583" class="small ink">Each layer has a narrow contract, so future SQLite, vector recall, and dream-loop engines can attach without changing the public filesystem.</text>
</svg>
